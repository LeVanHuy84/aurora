name: CI - Code Quality & Build Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Type-Check (Monorepo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (@aurora/types)
        run: pnpm --filter types build

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Type-check API (NestJS)
        run: pnpm --filter api exec tsc --noEmit

      - name: Type-check Mobile (Expo)
        run: pnpm --filter mobile exec tsc --noEmit
