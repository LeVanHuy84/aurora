name: CI - Code Quality & Build Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    name: Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (@aurora/types)
        run: pnpm --filter @aurora/types build

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run Linting (All packages)
        run: pnpm lint

      - name: Run Type-Check (API, Mobile, Types)
        run: pnpm type-check

      - name: Run Unit Tests (API Vitest Suite)
        run: pnpm --filter api test

      - name: Verify Monorepo Build
        run: pnpm build

  docker-build-check:
    name: Backend API Docker Build Test
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Docker Image (Backend API)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: aurora-api:ci-test
